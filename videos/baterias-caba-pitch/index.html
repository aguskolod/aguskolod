<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Baterías CABA — Walkthrough UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Saira:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --asphalt: #0e0f10;
        --ink: #f2f1ec;
        --ink-dim: rgba(242, 241, 236, 0.62);
        --signal: #ff5a1f;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Inter Tight", system-ui, sans-serif;
        color: var(--ink);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--asphalt);
      }
      .clip {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .stage {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 70% 50% at 50% 18%, rgba(255, 90, 31, 0.14), transparent 55%),
          linear-gradient(180deg, #141516 0%, #0e0f10 55%, #090a0b 100%);
      }

      .phone {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 390px;
        height: 800px;
        transform: translate(-50%, -50%);
        border-radius: 46px;
        background: #1a1b1d;
        border: 3px solid #3a3b3d;
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }
      .phone .notch {
        position: absolute;
        top: 11px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 28px;
        background: #0a0a0a;
        border-radius: 20px;
        z-index: 3;
      }
      .phone .screen {
        position: absolute;
        inset: 12px;
        border-radius: 36px;
        overflow: hidden;
        background: #000;
      }
      .phone video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        display: block;
      }

      .laptop {
        position: absolute;
        left: 50%;
        top: 52%;
        width: 1280px;
        transform: translate(-50%, -50%);
      }
      .laptop .lid {
        height: 720px;
        border-radius: 16px 16px 0 0;
        background: #222;
        border: 3px solid #3a3b3d;
        border-bottom: none;
        overflow: hidden;
        box-shadow: 0 36px 90px rgba(0, 0, 0, 0.55);
      }
      .laptop .chrome {
        height: 34px;
        background: #2a2b2d;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
      }
      .laptop .chrome i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: block;
        background: #555;
      }
      .laptop .chrome i:nth-child(1) { background: #ff5a1f; }
      .laptop .chrome i:nth-child(2) { background: #f5c542; }
      .laptop .chrome i:nth-child(3) { background: #25d366; }
      .laptop .url {
        margin-left: 12px;
        flex: 1;
        height: 20px;
        border-radius: 4px;
        background: #1a1b1d;
        color: var(--ink-dim);
        font-size: 12px;
        display: flex;
        align-items: center;
        padding: 0 10px;
      }
      .laptop .viewport {
        height: calc(100% - 34px);
        overflow: hidden;
        background: #000;
      }
      .laptop video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        display: block;
      }
      .laptop .base {
        height: 26px;
        background: linear-gradient(180deg, #3a3b3d, #2a2b2d);
        border-radius: 0 0 10px 10px;
      }

      .title-card {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 72px;
        display: flex;
        justify-content: center;
        z-index: 20;
        pointer-events: none;
      }
      .title-card .pill {
        max-width: 1100px;
        padding: 18px 32px;
        background: rgba(14, 15, 16, 0.84);
        border: 1px solid rgba(242, 241, 236, 0.14);
        border-left: 4px solid var(--signal);
        font-family: "Saira", sans-serif;
        font-weight: 700;
        font-size: 34px;
        letter-spacing: -0.02em;
        line-height: 1.2;
        text-align: center;
        color: var(--ink);
      }

      .end {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        text-align: center;
      }
      .end .brand {
        font-family: "Saira", sans-serif;
        font-weight: 800;
        font-size: 96px;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .end .brand span { color: var(--signal); }
      .end .meta {
        font-size: 28px;
        font-weight: 600;
        color: var(--ink-dim);
      }
      .end .meta strong { color: var(--signal); font-weight: 700; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="44"
      data-width="1920"
      data-height="1080"
    >
      <!-- Mobile scene chrome (timed) -->
      <section id="mobile-scene" class="clip" data-start="0" data-duration="34" data-track-index="1">
        <div class="stage"></div>
        <div class="phone" id="phone">
          <div class="notch"></div>
          <div class="screen"></div>
        </div>
      </section>
      <!-- Mobile capture — timed as own clip, positioned into phone screen -->
      <video
        id="mobile-vid"
        class="clip"
        data-start="0"
        data-duration="34"
        data-media-start="0"
        data-track-index="2"
        src="assets/recordings/mobile-walkthrough.mp4"
        muted
        playsinline
        preload="auto"
        style="
          left: 50%;
          top: 50%;
          width: 366px;
          height: 776px;
          margin: 0;
          transform: translate(-50%, -50%);
          border-radius: 34px;
          object-fit: cover;
          object-position: top center;
          z-index: 5;
        "
      ></video>

      <!-- Desktop scene chrome -->
      <section id="desktop-scene" class="clip" data-start="34" data-duration="6" data-track-index="1">
        <div class="stage"></div>
        <div class="laptop" id="laptop">
          <div class="lid">
            <div class="chrome">
              <i></i><i></i><i></i>
              <div class="url">bateriascaba · Viamonte 2031</div>
            </div>
            <div class="viewport"></div>
          </div>
          <div class="base"></div>
        </div>
      </section>
      <video
        id="desktop-vid"
        class="clip"
        data-start="34"
        data-duration="6"
        data-media-start="0"
        data-track-index="2"
        src="assets/recordings/desktop-walkthrough.mp4"
        muted
        playsinline
        preload="auto"
        style="
          left: 50%;
          top: calc(52% - 13px);
          width: 1274px;
          height: 686px;
          margin: 0;
          transform: translate(-50%, -50%);
          border-radius: 0;
          object-fit: cover;
          object-position: top center;
          z-index: 5;
        "
      ></video>

      <!-- End card -->
      <section id="end-scene" class="clip" data-start="40" data-duration="4" data-track-index="1">
        <div class="stage"></div>
        <div class="end" id="end-card">
          <div class="brand">Baterías <span>CABA</span></div>
          <div class="meta"><strong>24 hs</strong> · Viamonte 2031</div>
        </div>
      </section>

      <!-- Sparse UX titles -->
      <div id="title-sticky" class="clip title-card" data-start="8" data-duration="4" data-track-index="3">
        <div class="pill" id="t1">Contacto siempre a mano</div>
      </div>
      <div id="title-buttons" class="clip title-card" data-start="12" data-duration="5.5" data-track-index="3">
        <div class="pill" id="t2">Botones fáciles para contactar en cualquier momento</div>
      </div>
      <div id="title-reviews" class="clip title-card" data-start="24" data-duration="4.5" data-track-index="3">
        <div class="pill" id="t3">Reseñas de Google</div>
      </div>
      <div id="title-map" class="clip title-card" data-start="29" data-duration="4.5" data-track-index="3">
        <div class="pill" id="t4">Dónde estás. Sin buscar.</div>
      </div>
      <div id="title-desktop" class="clip title-card" data-start="34" data-duration="5.5" data-track-index="3">
        <div class="pill" id="t5">También en escritorio</div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "#phone",
        { autoAlpha: 0, y: 48, scale: 0.94 },
        { autoAlpha: 1, y: 0, scale: 1, duration: 0.9, ease: "power3.out" },
        0.15
      );

      ["#t1", "#t2", "#t3", "#t4", "#t5"].forEach((sel, i) => {
        const starts = [8, 12, 24, 29, 34];
        const durs = [4, 5.5, 4.5, 4.5, 5.5];
        const s = starts[i];
        const d = durs[i];
        tl.fromTo(
          sel,
          { autoAlpha: 0, y: 18 },
          { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.out" },
          s + 0.1
        );
        tl.to(sel, { autoAlpha: 0, y: -10, duration: 0.35, ease: "power2.in" }, s + d - 0.4);
      });

      tl.fromTo(
        "#laptop",
        { autoAlpha: 0, y: 36, scale: 0.96 },
        { autoAlpha: 1, y: 0, scale: 1, duration: 0.75, ease: "power3.out" },
        34.05
      );

      tl.fromTo(
        "#end-card",
        { autoAlpha: 0, y: 24 },
        { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" },
        40.1
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
